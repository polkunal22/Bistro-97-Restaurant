<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserve a Table | Bistro 22</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="thank-you-body">
    <main class="thank-you-page">
      <div class="thank-you-card">
        <p class="eyebrow">Reservation Request</p>
        <h1>Reserve your table</h1>
        <p>Share your details and we will get back to you with confirmation.</p>
        <form class="reserve-form" action="thankyou.html" method="get">
          <label for="reservation-name">
            <span>Name</span>
            <input id="reservation-name" name="name" type="text" placeholder="Your name" required />
          </label>
          <label for="reservation-email">
            <span>Email</span>
            <input id="reservation-email" name="email" type="email" placeholder="you@example.com" required />
          </label>
          <label for="reservation-date">
            <span>Date</span>
            <input id="reservation-date" name="date" type="date" required />
          </label>
          <label for="reservation-guests">
            <span>Guests</span>
            <input id="reservation-guests" name="guests" type="number" min="1" max="10" value="2" required />
          </label>
          <button type="submit">Request Reservation</button>
        </form>
        <a class="btn btn-secondary" href="index.html">Back to Home</a>
      </div>
    </main>
  </body>
</html>
